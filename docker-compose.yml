name: testvasja

# Local development services only. Not a production topology.
#
# Concurrency correctness in Phases 5 and 7 depends on real PostgreSQL semantics
# (SELECT ... FOR UPDATE, numeric, transactional DDL), so the database is never
# substituted with SQLite — not even for tests.

services:
  postgres:
    image: postgres:17-alpine
    container_name: testvasja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testvasja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testvasja}
      POSTGRES_DB: ${POSTGRES_DB:-testvasja}
    ports:
      # Host port is configurable so a locally installed Postgres can keep 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports the server accepting connections, not merely the
      # container running, so `depends_on: service_healthy` is meaningful.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-testvasja} -d ${POSTGRES_DB:-testvasja}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
